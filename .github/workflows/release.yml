name: Release

# A tag v* builds the single-file downloads, each on a machine of its own platform, tries each one (tools/smoke-test.mjs)
# and puts them with their SHA-256 sums on a draft release; a person publishes it. Started by hand, it only builds and tries
# them: the files are left on the run, and no release is made.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Publish
        run: dotnet publish src/Pusula -c Release -r ${{ matrix.rid }} -o publish

      # Apple Silicon runs no code without a signature; the SDK signs the file ad hoc when it publishes on macOS.
      - name: Signature (macOS)
        if: runner.os == 'macOS'
        run: codesign --verify --verbose publish/pusula

      - name: Smoke test
        run: node tools/smoke-test.mjs publish/pusula${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Name the file
        shell: bash
        run: |
          extension=""
          if [ "$RUNNER_OS" = "Windows" ]; then extension=".exe"; fi
          mkdir dist
          cp "publish/pusula$extension" "dist/pusula-${GITHUB_REF_NAME}-${{ matrix.rid }}$extension"
          ls -l dist

      - name: Keep the file
        uses: actions/upload-artifact@v7
        with:
          name: pusula-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get the files
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum pusula-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The notes are the part of CHANGELOG.md under the heading of this version.
      - name: Notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } /^## \[/ { if (found) exit } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $version"; exit 1; fi

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
