name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build
        run: dotnet build pusula.slnx

      - name: Test (.NET)
        run: dotnet test --solution pusula.slnx

      - name: Test (UI)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test "tests/web/*.test.mjs"

      # The download of a release: one file, started from a folder of its own (tools/smoke-test.mjs says what it checks).
      - name: Publish the single file
        run: dotnet publish src/Pusula -c Release -r ${{ matrix.rid }} -o publish

      - name: Smoke test (the single file)
        run: node tools/smoke-test.mjs publish/pusula${{ runner.os == 'Windows' && '.exe' || '' }}
